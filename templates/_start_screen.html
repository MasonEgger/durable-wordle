<div id="start-screen" class="view screen-enter">

    <!-- Top: mascot + tagline + divider -->
    <div class="view__intro">
        <img src="/static/mascot.svg" alt="Temporal mascot" class="mascot mascot--start" draggable="false">

        <p class="tagline">
            Get 6 chances to guess a 5-letter word
        </p>

        <div class="divider"></div>
    </div>

    <!-- Bottom: form inputs + side-by-side PLAY / LEADERBOARD buttons -->
    <form id="start-form"
          class="form-stack"
          hx-post="/play"
          hx-target="#screen"
          hx-swap="innerHTML">

        <div class="form-grid">
            <div class="field">
                <label class="field-label">First Name</label>
                <input type="text" name="first_name" placeholder="MIN 3 CHARS" minlength="3" required
                       class="text-input text-input--code">
            </div>
            <div class="field">
                <label class="field-label">Last Name</label>
                <input type="text" name="last_name" placeholder="MIN 3 CHARS" minlength="3"
                       class="text-input text-input--code">
            </div>
        </div>

        <div class="field">
            <label class="field-label">Email <span class="field-note">(for prize notification)</span></label>
            <input type="email" name="email" placeholder="you@example.com" required
                   class="text-input">
        </div>

        <p class="eyebrow">
            A Quick Mad Libs Before You Start...
        </p>

        <div class="form-grid">
            <input type="text" name="madlib_noun" placeholder="NOUN"
                   class="text-input text-input--code">
            <input type="text" name="madlib_verb" placeholder="PAST TENSE VERB"
                   class="text-input text-input--code">
        </div>

        <div class="action-row">
            <button type="submit"
                    class="btn btn--primary btn--full">
                PLAY
            </button>
            <button type="button"
                    class="btn btn--secondary btn--full"
                    hx-get="/leaderboard-screen"
                    hx-target="#screen"
                    hx-swap="innerHTML">
                LEADERBOARD
            </button>
        </div>
    </form>

</div>
