<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Durable Wordle</title>
    <link rel="icon" href="/static/mascot.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/tailwind.css">
    <link rel="stylesheet" href="/static/app.css">
    <script src="/static/htmx.min.js"></script>
</head>
<body class="app-body">

    <header class="app-header">
        <h1 id="main-title" class="app-title font-mono font-bold {{ 'text-temporal-grellow' if screen_state == 'start' else 'text-white' }}">Durable Wordle</h1>
        <p class="brand-line text-temporal-indigo">

        </p>
        <div class="header-divider"></div>
    </header>

    <main id="screen" class="screen-root">
        {% include current_screen_template %}
    </main>

    <script>
    // ── Timing constants ───────────────────────────────────────────────────────
    var TILE_FLIP_MS = 300;      // delay between consecutive tile flips
    var TILE_COLOR_OFFSET = 250; // ms into a flip when the color swaps (mid-flip)
    var SHAKE_DURATION_MS = 500; // shake animation duration
    var ERROR_DISMISS_MS = 2000; // auto-dismiss for error overlays
    var MADLIB_CYCLE_MS = 3000;  // interval between madlib phrase swaps
    var MADLIB_FADE_MS = 300;    // fade-out duration before swapping text
    var AUTO_SHARE_AFTER_REVEAL_MS = 350; // pause after final tile before selfie
    var INACTIVITY_SECONDS = 60;
    var START_IDLE_DELAY_MS = 10000; // start-screen attract animation delay
    var IDLE_DEMO_TYPE_MS = 120;
    var IDLE_DEMO_ROW_MS = 2200;
    var IDLE_DEMO_REVEAL_AFTER_MS = 760;
    var IDLE_DEMO_RESTART_PAUSE_MS = 1800;
    var MAX_LENGTH = 5;
    var IDLE_DEMO_SEQUENCES = [
        {"target": "PLANT", "guesses": ["ALERT", "SLANT", "PLANT"]},
        {"target": "BRAVE", "guesses": ["STARE", "CRANE", "GRAPE", "BRAVE"]},
        {"target": "CHIME", "guesses": ["MIGHT", "CLING", "CHIDE", "CHIME"]},
        {"target": "TIMER", "guesses": ["CRANE", "BLUSH", "MIGHT", "TILER", "TIMER"]},
        {
            "target": "SPARK",
            "guesses": ["TRACE", "CRISP", "PARKS", "SHARK", "SPARE", "SPARK"]
        }
    ];
    var IDLE_DEMO_FEEDBACK_CLASS = {
        correct: 'bg-green-500 border-green-500',
        present: 'bg-amber-500 border-amber-500',
        absent: 'bg-wordle-absent border-wordle-absent'
    };

    // ── Header color + title text ──────────────────────────────────────────────
    function updateHeaderColor(toScreen) {
        var title = document.getElementById('main-title');
        if (!title) return;
        if (toScreen === 'start' || toScreen === 'leaderboard') {
            title.classList.remove('text-white');
            title.classList.add('text-temporal-grellow');
        } else {
            title.classList.remove('text-temporal-grellow');
            title.classList.add('text-white');
        }
        if (toScreen === 'leaderboard') {
            title.textContent = 'Durable Wordle Leaderboard';
            title.classList.add('is-compact');
        } else {
            title.textContent = 'Durable Wordle';
            title.classList.remove('is-compact');
        }
    }

    // ── Madlib cycling ─────────────────────────────────────────────────────────
    var madlibInterval = null;

    function initMadlibCycle() {
        if (madlibInterval) { clearInterval(madlibInterval); madlibInterval = null; }
        var screen = document.getElementById('leaderboard-screen');
        if (!screen) return;
        var raw = screen.getAttribute('data-madlibs');
        if (!raw) return;
        var madlibs;
        try { madlibs = JSON.parse(raw); } catch(e) { return; }
        if (!madlibs || madlibs.length < 2) return;

        var nounEl = document.getElementById('madlib-noun-chip');
        var verbEl = document.getElementById('madlib-verb-chip');
        var areaEl = document.getElementById('madlib-area');
        if (!nounEl || !verbEl || !areaEl) return;

        var idx = 0;
        madlibInterval = setInterval(function() {
            areaEl.style.opacity = '0';
            setTimeout(function() {
                idx = (idx + 1) % madlibs.length;
                nounEl.textContent = madlibs[idx][0];
                verbEl.textContent = madlibs[idx][1];
                areaEl.style.opacity = '1';
            }, MADLIB_FADE_MS);
        }, MADLIB_CYCLE_MS);
    }

    // Init on full-page load if leaderboard is present
    initMadlibCycle();

    // ── Timer ──────────────────────────────────────────────────────────────────
    var timerInterval = null;

    function formatElapsed(seconds) {
        var h = Math.floor(seconds / 3600);
        var m = Math.floor((seconds % 3600) / 60);
        var s = seconds % 60;
        return [h, m, s].map(function(v) { return String(v).padStart(2, '0'); }).join(':');
    }

    function startTimer(fromTs) {
        if (timerInterval) clearInterval(timerInterval);
        function tick() {
            var el = document.getElementById('timer-area');
            if (!el) { clearInterval(timerInterval); timerInterval = null; return; }
            var elapsed = Math.max(0, Math.floor(Date.now() / 1000 - fromTs));
            el.textContent = formatElapsed(elapsed);
        }
        tick();
        timerInterval = setInterval(tick, 1000);
    }

    function stopTimer() {
        if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
    }

    function initTimerFromScreen() {
        var tsInput = document.getElementById('started-at-ts');
        if (tsInput) {
            var ts = parseInt(tsInput.value, 10);
            if (ts > 0) startTimer(ts);
        }
    }

    // ── Inactivity countdown (mirrors the workflow's 60s timeout) ────────────────
    var countdownInterval = null;
    var countdownEnd = 0;
    var countdownTimedOut = false;

    function applyCountdownVisualState(remaining) {
        var screen = document.getElementById('game-screen');
        var area = document.getElementById('countdown-area');
        if (!screen || !area) return;
        var total = parseInt(area.dataset.totalSeconds || String(INACTIVITY_SECONDS), 10);
        var boundedRemaining = Math.max(0, Math.min(total, remaining));
        var urgency = total > 0 ? 1 - (boundedRemaining / total) : 1;
        var scale = 1 + urgency * 0.55;
        screen.style.setProperty('--countdown-urgency', urgency.toFixed(3));
        screen.style.setProperty('--countdown-scale', scale.toFixed(3));
        area.classList.toggle('urgent', boundedRemaining <= 20 && boundedRemaining > 10);
        area.classList.toggle('critical', boundedRemaining <= 10);
    }

    function showCountdownZero() {
        var area = document.getElementById('countdown-area');
        var el = document.getElementById('countdown-value');
        if (area) area.style.display = '';
        if (!el) return;
        el.textContent = '0:00';
        el.classList.add('text-red-400');
        el.classList.remove('text-temporal-grellow');
        applyCountdownVisualState(0);
    }

    function countdownTick() {
        var el = document.getElementById('countdown-value');
        if (!el) { stopCountdown(); return; }
        var remaining = Math.max(0, Math.round((countdownEnd - Date.now()) / 1000));
        el.textContent = Math.floor(remaining / 60) + ':' + String(remaining % 60).padStart(2, '0');
        el.classList.toggle('text-red-400', remaining <= 10);
        el.classList.toggle('text-temporal-grellow', remaining > 10);
        applyCountdownVisualState(remaining);
        if (remaining <= 0) {
            countdownTimedOut = true;
            stopCountdown();
            showCountdownZero();
            revealOnTimeout();
        }
    }

    function startCountdown() {
        stopCountdown();
        var area = document.getElementById('countdown-area');
        if (!area) return;
        if (countdownTimedOut) {
            showCountdownZero();
            return;
        }
        if (!document.getElementById('guess-form')) {  // game over — hide it
            if (area) area.style.display = 'none';
            return;
        }
        if (area) area.style.display = '';
        applyCountdownVisualState(INACTIVITY_SECONDS);
        countdownEnd = Date.now() + INACTIVITY_SECONDS * 1000;
        countdownTick();
        countdownInterval = setInterval(countdownTick, 250);
    }

    function stopCountdown() {
        if (countdownInterval) { clearInterval(countdownInterval); countdownInterval = null; }
    }

    // On timeout the workflow abandons; fetch the revealed board (retry until the
    // server has finished abandoning and the endgame actions appear).
    function revealOnTimeout() {
        var tries = 0;
        countdownTimedOut = true;
        showCountdownZero();
        (function attempt() {
            tries++;
            htmx.ajax('GET', '/board', { target: '#game-content', swap: 'innerHTML' })
                .then(function () {
                    if (!document.getElementById('endgame-actions') && tries < 6) {
                        setTimeout(attempt, 1500);
                    }
                });
        })();
    }

    // Init timer on full-page load if game screen is present
    initTimerFromScreen();
    startCountdown();

    // Init leaderboard on full-page load if leaderboard screen is present
    if (document.getElementById('leaderboard-screen')) {
        updateHeaderColor('leaderboard');
        initMadlibCycle();
    }

    // ── Keyboard input ─────────────────────────────────────────────────────────
    var currentGuess = '';
    var guessInFlight = false;
    var startInFlight = false;
    var startIdleTimer = null;
    var startIdleDemoVisible = false;
    var startIdleDemoAnimationTimer = null;
    var startIdleDemoTimeouts = [];
    var startIdleDemoSequenceOrder = [];
    var startIdleDemoLastSequenceIndex = -1;

    function getCurrentTiles() {
        return document.querySelectorAll('.current-tile');
    }

    function updateTiles() {
        var tiles = getCurrentTiles();
        tiles.forEach(function(tile, index) {
            var letter = currentGuess[index] || '';
            tile.textContent = letter;
            // Border brightens when a letter is entered, dims when empty
            tile.classList.toggle('border-white/60', !!letter);
            tile.classList.toggle('border-wordle-tile-active', !letter);
        });
        var input = document.getElementById('guess-input');
        if (input) input.value = currentGuess;
    }

    function addLetter(letter) {
        if (guessInFlight) return;
        if (currentGuess.length >= MAX_LENGTH) return;
        currentGuess += letter.toUpperCase();
        updateTiles();
        var tiles = getCurrentTiles();
        var tile = tiles[currentGuess.length - 1];
        if (tile) {
            tile.classList.add('tile-pop');
            setTimeout(function() { tile.classList.remove('tile-pop'); }, 100); // matches .tile-pop CSS
        }
    }

    function removeLetter() {
        if (guessInFlight) return;
        if (currentGuess.length === 0) return;
        currentGuess = currentGuess.slice(0, -1);
        updateTiles();
    }

    function setGuessInFlight(nextValue) {
        guessInFlight = nextValue;
        document.querySelectorAll('.keyboard-key[data-action="enter"]').forEach(function(button) {
            button.disabled = nextValue;
            button.classList.toggle('opacity-50', nextValue);
        });
    }

    function submitGuess() {
        if (guessInFlight) return;
        if (currentGuess.length !== MAX_LENGTH) {
            var row = document.getElementById('current-row');
            if (row) {
                row.classList.add('shake');
                setTimeout(function() { row.classList.remove('shake'); }, SHAKE_DURATION_MS);
            }
            return;
        }
        // Post the guess explicitly. htmx.trigger(form, 'submit') fires a
        // synthetic submit that HTMX 2.x does NOT serialize, so the `guess`
        // field was missing. Build values from the real form so game_mode
        // radio buttons are submitted with keyboard and on-screen Enter.
        var form = document.getElementById('guess-form');
        if (!form) return;
        var values = {};
        new FormData(form).forEach(function(value, key) {
            values[key] = value;
        });
        values.guess = currentGuess;
        setGuessInFlight(true);
        htmx.ajax('POST', '/guess', {
            target: '#game-content',
            swap: 'innerHTML',
            values: values
        });
    }

    function submitStartForm(form) {
        if (startInFlight) return;
        if (!form.reportValidity()) return;

        stopStartIdleDemo();

        var values = {};
        new FormData(form).forEach(function(value, key) {
            values[key] = value;
        });

        startInFlight = true;
        var playButton = form.querySelector('button[type="submit"]');
        if (playButton) playButton.disabled = true;

        htmx.ajax('POST', '/play', {
            target: '#screen',
            swap: 'innerHTML',
            values: values
        }).catch(function() {
            startInFlight = false;
            if (playButton) playButton.disabled = false;
        });
    }

    function getStartScreen() {
        return document.getElementById('start-screen');
    }

    function setStartIdleDemoVisible(nextValue) {
        var screen = getStartScreen();
        startIdleDemoVisible = nextValue;
        if (!screen) return;
        screen.classList.toggle('start-screen--idle-demo', nextValue);
        screen.setAttribute('data-idle-demo-visible', nextValue ? 'true' : 'false');
        if (nextValue) startStartIdleDemoAnimation();
        else stopStartIdleDemoAnimation();
    }

    function stopStartIdleTimer() {
        if (startIdleTimer) {
            clearTimeout(startIdleTimer);
            startIdleTimer = null;
        }
    }

    function stopStartIdleDemo() {
        stopStartIdleTimer();
        setStartIdleDemoVisible(false);
    }

    function scheduleStartIdleDemo() {
        stopStartIdleTimer();
        if (!getStartScreen()) {
            setStartIdleDemoVisible(false);
            return;
        }
        startIdleTimer = setTimeout(function() {
            if (!getStartScreen()) return;
            setStartIdleDemoVisible(true);
        }, START_IDLE_DELAY_MS);
    }

    function initStartIdleDemo() {
        setStartIdleDemoVisible(false);
        scheduleStartIdleDemo();
    }

    function focusFirstStartInput() {
        var firstInput = document.querySelector('#start-form input[name="first_name"]');
        if (firstInput) firstInput.focus();
    }

    function clearStartIdleDemoTimeouts() {
        startIdleDemoTimeouts.forEach(function(timeoutId) {
            clearTimeout(timeoutId);
        });
        startIdleDemoTimeouts = [];
        if (startIdleDemoAnimationTimer) {
            clearTimeout(startIdleDemoAnimationTimer);
            startIdleDemoAnimationTimer = null;
        }
    }

    function scheduleStartIdleDemoAnimation(callback, delayMs) {
        var timeoutId = setTimeout(callback, delayMs);
        startIdleDemoTimeouts.push(timeoutId);
    }

    function resetStartIdleDemoBoard() {
        document.querySelectorAll('#start-idle-demo .wordle-tile').forEach(function(tile) {
            tile.textContent = '';
            tile.removeAttribute('data-demo-letter');
            tile.removeAttribute('data-color');
            tile.classList.remove(
                'tile-pop',
                'tile-reveal',
                'current-tile',
                'border-wordle-tile-active',
                'bg-green-500',
                'border-green-500',
                'bg-amber-500',
                'border-amber-500',
                'bg-wordle-absent',
                'border-wordle-absent'
            );
            tile.classList.add('border-wordle-tile-empty', 'bg-transparent');
        });
    }

    function calculateStartIdleDemoFeedback(guess, target) {
        var feedback = new Array(MAX_LENGTH).fill('absent');
        var remainingLetters = {};

        for (var letterIndex = 0; letterIndex < MAX_LENGTH; letterIndex++) {
            if (guess[letterIndex] === target[letterIndex]) {
                feedback[letterIndex] = 'correct';
            } else {
                var targetLetter = target[letterIndex];
                remainingLetters[targetLetter] = (remainingLetters[targetLetter] || 0) + 1;
            }
        }

        for (var checkIndex = 0; checkIndex < MAX_LENGTH; checkIndex++) {
            if (feedback[checkIndex] === 'correct') continue;
            var guessLetter = guess[checkIndex];
            if (remainingLetters[guessLetter] > 0) {
                feedback[checkIndex] = 'present';
                remainingLetters[guessLetter]--;
            }
        }

        return feedback;
    }

    function shuffleStartIdleDemoSequenceOrder() {
        var order = IDLE_DEMO_SEQUENCES.map(function(_, sequenceIndex) {
            return sequenceIndex;
        });
        for (var orderIndex = order.length - 1; orderIndex > 0; orderIndex--) {
            var swapIndex = Math.floor(Math.random() * (orderIndex + 1));
            var currentValue = order[orderIndex];
            order[orderIndex] = order[swapIndex];
            order[swapIndex] = currentValue;
        }
        if (order.length > 1 && order[0] === startIdleDemoLastSequenceIndex) {
            var firstValue = order[0];
            order[0] = order[1];
            order[1] = firstValue;
        }
        startIdleDemoSequenceOrder = order;
    }

    function nextStartIdleDemoSequence() {
        if (!startIdleDemoSequenceOrder.length) {
            shuffleStartIdleDemoSequenceOrder();
        }
        var sequenceIndex = startIdleDemoSequenceOrder.shift();
        startIdleDemoLastSequenceIndex = sequenceIndex;
        return IDLE_DEMO_SEQUENCES[sequenceIndex];
    }

    function buildStartIdleDemoPuzzle() {
        var sequence = nextStartIdleDemoSequence();
        var rows = sequence.guesses.map(function(guess) {
            return {
                guess: guess,
                feedback: calculateStartIdleDemoFeedback(guess, sequence.target)
            };
        });

        return { target: sequence.target, rows: rows };
    }

    function setStartIdleDemoRow(row, demoRow) {
        row.querySelectorAll('[data-demo-cell]').forEach(function(tile, tileIndex) {
            tile.dataset.demoLetter = demoRow.guess[tileIndex];
            tile.dataset.color = IDLE_DEMO_FEEDBACK_CLASS[demoRow.feedback[tileIndex]];
            tile.setAttribute('aria-label', demoRow.guess[tileIndex] + ', ' + demoRow.feedback[tileIndex]);
        });
    }

    function typeStartIdleDemoRow(row) {
        row.querySelectorAll('[data-demo-cell]').forEach(function(tile, tileIndex) {
            scheduleStartIdleDemoAnimation(function() {
                tile.textContent = tile.dataset.demoLetter || '';
                tile.classList.remove('border-wordle-tile-empty', 'bg-transparent');
                tile.classList.add('current-tile', 'border-wordle-tile-active', 'tile-pop');
                setTimeout(function() { tile.classList.remove('tile-pop'); }, 120);
            }, tileIndex * IDLE_DEMO_TYPE_MS);
        });
    }

    function revealStartIdleDemoRow(row) {
        row.querySelectorAll('[data-demo-cell][data-demo-letter]').forEach(function(tile) {
            tile.classList.remove('current-tile', 'border-wordle-tile-active');
            tile.classList.add('border-wordle-tile-empty', 'bg-transparent');
            tile.classList.remove('tile-reveal');
            void tile.offsetWidth;
            tile.classList.add('tile-reveal');

            var colorClass = tile.dataset.color || '';
            var delayMs = getAnimationDelayMs(tile);
            scheduleStartIdleDemoAnimation(function() {
                tile.classList.remove('border-wordle-tile-empty', 'bg-transparent');
                colorClass.split(' ').forEach(function(cls) {
                    if (cls) tile.classList.add(cls);
                });
            }, delayMs + TILE_COLOR_OFFSET);
        });
    }

    function runStartIdleDemoAnimation() {
        clearStartIdleDemoTimeouts();
        resetStartIdleDemoBoard();
        var puzzle = buildStartIdleDemoPuzzle();
        var rows = Array.prototype.slice.call(document.querySelectorAll('#start-idle-demo .guess-row'));
        puzzle.rows.forEach(function(demoRow, rowIndex) {
            var row = rows[rowIndex];
            if (!row) return;
            setStartIdleDemoRow(row, demoRow);
            var rowDelayMs = rowIndex * IDLE_DEMO_ROW_MS;
            scheduleStartIdleDemoAnimation(function() { typeStartIdleDemoRow(row); }, rowDelayMs);
            scheduleStartIdleDemoAnimation(function() { revealStartIdleDemoRow(row); }, rowDelayMs + IDLE_DEMO_REVEAL_AFTER_MS);
        });
        startIdleDemoAnimationTimer = setTimeout(
            runStartIdleDemoAnimation,
            puzzle.rows.length * IDLE_DEMO_ROW_MS + IDLE_DEMO_RESTART_PAUSE_MS
        );
    }

    function startStartIdleDemoAnimation() {
        clearStartIdleDemoTimeouts();
        runStartIdleDemoAnimation();
    }

    function stopStartIdleDemoAnimation() {
        clearStartIdleDemoTimeouts();
        resetStartIdleDemoBoard();
    }

    document.addEventListener('submit', function(event) {
        var form = event.target.closest('#start-form');
        if (!form) return;
        event.preventDefault();
        event.stopPropagation();
        submitStartForm(form);
    }, true);

    document.addEventListener('keydown', function(event) {
        if (!getStartScreen()) return;
        if (startIdleDemoVisible) {
            event.preventDefault();
            event.stopImmediatePropagation();
            setStartIdleDemoVisible(false);
            scheduleStartIdleDemo();
            focusFirstStartInput();
            return;
        }
        scheduleStartIdleDemo();
    }, true);

    function getAnimationDelayMs(element) {
        var rawDelay = window.getComputedStyle(element).animationDelay || '0ms';
        var firstDelay = rawDelay.split(',')[0].trim();
        var parsedDelay = parseFloat(firstDelay);
        if (!Number.isFinite(parsedDelay)) return 0;
        return firstDelay.endsWith('ms') ? parsedDelay : parsedDelay * 1000;
    }

    document.addEventListener('click', function(event) {
        var target = event.target.closest('.keyboard-key');
        if (!target) return;
        event.preventDefault();
        if (target.dataset.action === 'enter') submitGuess();
        else if (target.dataset.action === 'backspace') removeLetter();
        else if (target.dataset.key) addLetter(target.dataset.key);
        // Drop focus after a real pointer click so physical-keyboard letter
        // entry keeps flowing (the global keydown handler bails on focused
        // buttons). Keyboard-activated clicks (detail === 0) keep focus.
        if (event.detail > 0) target.blur();
    });

    document.addEventListener('keydown', function(event) {
        var target = event.target;
        var tag = target.tagName;
        if (tag === 'INPUT' || tag === 'TEXTAREA' || target.isContentEditable) return;
        if (event.ctrlKey || event.metaKey || event.altKey) return;

        // Space activates a focused link (anchors only do this for Enter
        // natively); used by the START OVER links.
        if (tag === 'A' && (event.key === ' ' || event.key === 'Spacebar')) {
            event.preventDefault();
            target.click();
            return;
        }

        // Let Enter/Space activate a focused button or link natively
        // (PLAY, LEADERBOARD, START OVER, on-screen keys) instead of hijacking
        // it for the game keyboard. Other physical keys still drive the game
        // even when an on-screen key has focus.
        var focusedControl = tag === 'BUTTON' || tag === 'A' || tag === 'SELECT';
        var gameInputKey = event.key === 'Backspace' || /^[a-zA-Z]$/.test(event.key);
        if (focusedControl && !gameInputKey) return;

        // Otherwise focus is on the page body — drive the game keyboard, but
        // only while a guess can actually be made.
        if (!document.getElementById('guess-form')) return;
        if (event.key === 'Enter') { event.preventDefault(); submitGuess(); }
        else if (event.key === 'Backspace') { event.preventDefault(); removeLetter(); }
        else if (/^[a-zA-Z]$/.test(event.key)) { event.preventDefault(); addLetter(event.key); }
    });

    // ── HTMX lifecycle ─────────────────────────────────────────────────────────
    document.body.addEventListener('htmx:afterSwap', function(event) {
        var targetId = event.detail.target.id;

        if (targetId === 'screen') {
            currentGuess = '';
            startInFlight = false;
            countdownTimedOut = false;
            stopTimer();
            if (document.getElementById('game-screen')) {
                stopStartIdleDemo();
                updateHeaderColor('game');
                initTimerFromScreen();
                startCountdown();
            } else if (document.getElementById('start-screen')) {
                updateHeaderColor('start');
                initStartIdleDemo();
            } else if (document.getElementById('leaderboard-screen')) {
                stopStartIdleDemo();
                updateHeaderColor('leaderboard');
                initMadlibCycle();
            } else if (document.getElementById('share-screen')) {
                stopStartIdleDemo();
                stopCountdown();
                updateHeaderColor('start');
            }
            return;
        }

        if (targetId === 'game-content') {
            currentGuess = '';
            setGuessInFlight(false);
            // A landed guess resets the inactivity window (or stops it if the
            // game just ended — startCountdown no-ops when there's no guess form).
            startCountdown();

            // Flip animation: apply color class at midpoint of each tile's flip,
            // and light the matching keyboard key in sync with that tile.
            document.querySelectorAll('.tile-reveal').forEach(function(tile) {
                var colorClass = tile.dataset.color;
                var delayMs = getAnimationDelayMs(tile);
                setTimeout(function() {
                    tile.classList.remove('border-wordle-tile-empty', 'border-wordle-tile-active', 'bg-transparent', 'bg-[rgba(55,71,97,0.3)]');
                    colorClass.split(' ').forEach(function(cls) { tile.classList.add(cls); });
                }, delayMs + TILE_COLOR_OFFSET);
            });

            document.querySelectorAll('#keyboard .keyboard-key[data-newbg][data-reveal-index]').forEach(function(kbKey) {
                var keyDelayMs = parseInt(kbKey.dataset.revealIndex, 10) * TILE_FLIP_MS;
                setTimeout(function() {
                    kbKey.classList.remove('key-flip');
                    void kbKey.offsetWidth;
                    kbKey.classList.add('key-flip');
                }, keyDelayMs);
                setTimeout(function() {
                    kbKey.classList.remove('bg-wordle-key', 'bg-green-500', 'bg-amber-500', 'bg-wordle-absent');
                    kbKey.classList.add(kbKey.dataset.newbg);
                }, keyDelayMs + TILE_COLOR_OFFSET);
            });

            // Show status + endgame after last tile finishes
            var revealTiles = document.querySelectorAll('.tile-reveal');
            var revealDelay = revealTiles.length > 0
                ? (revealTiles.length - 1) * TILE_FLIP_MS + TILE_FLIP_MS + 200
                : 0;

            setTimeout(function() {
                var statusMsg = document.getElementById('status-message');
                if (statusMsg) statusMsg.classList.remove('hidden');

                var endgame = document.getElementById('endgame-actions');
                if (endgame) {
                    endgame.classList.remove('hidden');
                    stopTimer();
                }

                document.querySelectorAll('.current-tile').forEach(function(tile) {
                    tile.classList.remove('border-wordle-tile-active');
                    tile.classList.add('border-wordle-tile-empty', 'bg-transparent');
                });

                var board = document.getElementById('game-board');
                if (board && board.dataset.autoShareAfterReveal === 'true') {
                    stopCountdown();
                    setTimeout(function() {
                        htmx.ajax('GET', '/share', { target: '#screen', swap: 'innerHTML' });
                    }, AUTO_SHARE_AFTER_REVEAL_MS);
                }
            }, revealDelay);

            // Auto-dismiss error overlay after 2 s
            var errorMsg = document.getElementById('error-message');
            if (errorMsg) setTimeout(function() { errorMsg.remove(); }, ERROR_DISMISS_MS);
        }
    });

    function isGuessRequestEvent(event) {
        var detail = event.detail || {};
        if (detail.pathInfo && detail.pathInfo.requestPath === '/guess') return true;
        if (detail.requestConfig && detail.requestConfig.path === '/guess') return true;
        if (!detail.xhr || !detail.xhr.responseURL) return false;
        try {
            return new URL(detail.xhr.responseURL).pathname === '/guess';
        } catch(e) {
            return detail.xhr.responseURL.indexOf('/guess') >= 0;
        }
    }

    function showGuessError(message) {
        setGuessInFlight(false);

        var row = document.getElementById('current-row');
        if (row) {
            row.classList.add('shake');
            setTimeout(function() { row.classList.remove('shake'); }, SHAKE_DURATION_MS);
        }

        var existing = document.getElementById('error-toast');
        if (existing) existing.remove();

        var toast = document.createElement('div');
        toast.id = 'error-toast';
        toast.className = 'fixed top-16 left-1/2 -translate-x-1/2 bg-white text-black px-4 py-2 rounded font-bold text-sm z-50';
        toast.textContent = message;
        document.body.appendChild(toast);
        setTimeout(function() { toast.remove(); }, ERROR_DISMISS_MS);
    }

    function guessErrorFromTriggerHeader(xhr) {
        if (!xhr) return '';
        var triggerHeader = xhr.getResponseHeader('HX-Trigger') || '';
        if (!triggerHeader) return '';
        try {
            var triggers = JSON.parse(triggerHeader);
            return triggers.guessError || '';
        } catch(e) {
            return '';
        }
    }

    document.body.addEventListener('guessError', function(event) {
        showGuessError(event.detail.value || 'Something went wrong — try again');
    });

    document.body.addEventListener('htmx:responseError', function(event) {
        if (isGuessRequestEvent(event)) {
            showGuessError(
                guessErrorFromTriggerHeader(event.detail.xhr) || 'Something went wrong — try again'
            );
        }
    });

    document.body.addEventListener('htmx:sendError', function(event) {
        if (isGuessRequestEvent(event)) {
            showGuessError('Something went wrong — try again');
        }
    });

    initStartIdleDemo();
    </script>
</body>
</html>
