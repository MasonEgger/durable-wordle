<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Durable Wordle</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <script>
    tailwind.config = {
        theme: {
            extend: {
                colors: {
                    'temporal-uv': '#444CE7',
                    'temporal-black': '#141414',
                    'temporal-white': '#F8FAFC',
                    'temporal-grellow': '#cfff0d',
                    'temporal-indigo': '#cacbf9',
                    'wordle-absent': '#2d3458',
                    'wordle-tile-empty': '#243349',
                    'wordle-tile-active': '#374761',
                    'wordle-key': '#7c8fb1',
                },
                fontFamily: {
                    'mono': ['"Space Mono"', 'monospace'],
                }
            }
        }
    }
    </script>
    <style>
        body {
            background: #121213;
        }
        .tile-reveal {
            animation: reveal 0.5s ease-in-out both;
        }
        @keyframes reveal {
            0% { transform: rotateX(0deg); }
            50% { transform: rotateX(90deg); }
            100% { transform: rotateX(0deg); }
        }
        .tile-pop { animation: pop 0.1s ease-in-out; }
        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
        .shake { animation: shake 0.5s ease-in-out; }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-4px); }
            20%, 40%, 60%, 80% { transform: translateX(4px); }
        }
        .screen-enter {
            animation: screenIn 0.3s ease-out both;
        }
        @keyframes screenIn {
            from { opacity: 0; transform: translateY(12px); }
            to   { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="text-white min-h-screen flex flex-col items-center">

    <header class="w-full max-w-lg pt-8 pb-4 flex flex-col items-center gap-2 px-4">
        <h1 id="main-title" class="font-mono font-bold text-2xl sm:text-3xl {{ 'text-temporal-grellow' if screen_state == 'start' else 'text-white' }} text-center leading-relaxed">Durable Wordle</h1>
        <p class="font-mono text-xs tracking-widest text-temporal-indigo uppercase flex items-center gap-2">
            POWERED BY

        </p>
        <div class="w-full border-b border-[#3a3a3c] mt-2"></div>
    </header>

    <main id="screen" class="flex-1 flex flex-col items-center w-full">
        {% include current_screen_template %}
    </main>

    <script>
    // ── Header color + title text ──────────────────────────────────────────────
    function updateHeaderColor(toScreen) {
        var title = document.getElementById('main-title');
        if (!title) return;
        if (toScreen === 'start' || toScreen === 'leaderboard') {
            title.classList.remove('text-white');
            title.classList.add('text-temporal-grellow');
        } else {
            title.classList.remove('text-temporal-grellow');
            title.classList.add('text-white');
        }
        if (toScreen === 'leaderboard') {
            title.textContent = 'Durable Wordle Leaderboard';
            title.classList.add('text-xl', 'sm:text-2xl');
            title.classList.remove('text-2xl', 'sm:text-3xl');
        } else {
            title.textContent = 'Durable Wordle';
            title.classList.remove('text-xl', 'sm:text-2xl');
            title.classList.add('text-2xl', 'sm:text-3xl');
        }
    }

    // ── Madlib cycling ─────────────────────────────────────────────────────────
    var madlibInterval = null;

    function initMadlibCycle() {
        if (madlibInterval) { clearInterval(madlibInterval); madlibInterval = null; }
        var screen = document.getElementById('leaderboard-screen');
        if (!screen) return;
        var raw = screen.getAttribute('data-madlibs');
        if (!raw) return;
        var madlibs;
        try { madlibs = JSON.parse(raw); } catch(e) { return; }
        if (!madlibs || madlibs.length < 2) return;

        var nounEl = document.getElementById('madlib-noun-chip');
        var verbEl = document.getElementById('madlib-verb-chip');
        var areaEl = document.getElementById('madlib-area');
        if (!nounEl || !verbEl || !areaEl) return;

        var idx = 0;
        madlibInterval = setInterval(function() {
            areaEl.style.opacity = '0';
            setTimeout(function() {
                idx = (idx + 1) % madlibs.length;
                nounEl.textContent = madlibs[idx][0];
                verbEl.textContent = madlibs[idx][1];
                areaEl.style.opacity = '1';
            }, MADLIB_FADE_MS);
        }, MADLIB_CYCLE_MS);
    }

    // Init on full-page load if leaderboard is present
    initMadlibCycle();

    // ── Timer ──────────────────────────────────────────────────────────────────
    var timerInterval = null;

    function formatElapsed(seconds) {
        var h = Math.floor(seconds / 3600);
        var m = Math.floor((seconds % 3600) / 60);
        var s = seconds % 60;
        return [h, m, s].map(function(v) { return String(v).padStart(2, '0'); }).join(':');
    }

    function startTimer(fromTs) {
        if (timerInterval) clearInterval(timerInterval);
        function tick() {
            var el = document.getElementById('timer-area');
            if (!el) { clearInterval(timerInterval); timerInterval = null; return; }
            var elapsed = Math.max(0, Math.floor(Date.now() / 1000 - fromTs));
            el.textContent = formatElapsed(elapsed);
        }
        tick();
        timerInterval = setInterval(tick, 1000);
    }

    function stopTimer() {
        if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
    }

    function initTimerFromScreen() {
        var tsInput = document.getElementById('started-at-ts');
        if (tsInput) {
            var ts = parseInt(tsInput.value, 10);
            if (ts > 0) startTimer(ts);
        }
    }

    // Init timer on full-page load if game screen is present
    initTimerFromScreen();

    // Init leaderboard on full-page load if leaderboard screen is present
    if (document.getElementById('leaderboard-screen')) {
        updateHeaderColor('leaderboard');
        initMadlibCycle();
    }

    // ── Timing constants ───────────────────────────────────────────────────────
    var TILE_FLIP_MS = 300;      // delay between consecutive tile flips
    var TILE_COLOR_OFFSET = 250; // ms into a flip when the color swaps (mid-flip)
    var SHAKE_DURATION_MS = 500; // shake animation duration
    var ERROR_DISMISS_MS = 2000; // auto-dismiss for error overlays
    var MADLIB_CYCLE_MS = 3000;  // interval between madlib phrase swaps
    var MADLIB_FADE_MS = 300;    // fade-out duration before swapping text

    // ── Keyboard input ─────────────────────────────────────────────────────────
    var currentGuess = '';
    var MAX_LENGTH = 5;

    function getCurrentTiles() {
        return document.querySelectorAll('.current-tile');
    }

    function updateTiles() {
        var tiles = getCurrentTiles();
        tiles.forEach(function(tile, index) {
            var letter = currentGuess[index] || '';
            tile.textContent = letter;
            // Border brightens when a letter is entered, dims when empty
            tile.classList.toggle('border-white/60', !!letter);
            tile.classList.toggle('border-wordle-tile-active', !letter);
        });
        var input = document.getElementById('guess-input');
        if (input) input.value = currentGuess;
    }

    function addLetter(letter) {
        if (currentGuess.length >= MAX_LENGTH) return;
        currentGuess += letter.toUpperCase();
        updateTiles();
        var tiles = getCurrentTiles();
        var tile = tiles[currentGuess.length - 1];
        if (tile) {
            tile.classList.add('tile-pop');
            setTimeout(function() { tile.classList.remove('tile-pop'); }, 100); // matches .tile-pop CSS
        }
    }

    function removeLetter() {
        if (currentGuess.length === 0) return;
        currentGuess = currentGuess.slice(0, -1);
        updateTiles();
    }

    function submitGuess() {
        if (currentGuess.length !== MAX_LENGTH) {
            var row = document.getElementById('current-row');
            if (row) {
                row.classList.add('shake');
                setTimeout(function() { row.classList.remove('shake'); }, SHAKE_DURATION_MS);
            }
            return;
        }
        // Post the guess explicitly. htmx.trigger(form, 'submit') fires a
        // synthetic submit that HTMX 2.x does NOT serialize, so the `guess`
        // field was missing → 422. Passing values guarantees it's sent.
        if (!document.getElementById('guess-form')) return;
        htmx.ajax('POST', '/guess', {
            target: '#game-content',
            swap: 'innerHTML',
            values: { guess: currentGuess }
        });
    }

    document.addEventListener('click', function(event) {
        var target = event.target.closest('.keyboard-key');
        if (!target) return;
        if (target.dataset.action === 'enter') submitGuess();
        else if (target.dataset.action === 'backspace') removeLetter();
        else if (target.dataset.key) addLetter(target.dataset.key);
    });

    document.addEventListener('keydown', function(event) {
        if (event.target.tagName === 'TEXTAREA') return;
        if (event.target.tagName === 'INPUT') return;
        if (event.ctrlKey || event.metaKey || event.altKey) return;
        if (event.key === 'Enter') { event.preventDefault(); submitGuess(); }
        else if (event.key === 'Backspace') { event.preventDefault(); removeLetter(); }
        else if (/^[a-zA-Z]$/.test(event.key)) { event.preventDefault(); addLetter(event.key); }
    });

    // ── HTMX lifecycle ─────────────────────────────────────────────────────────
    document.body.addEventListener('htmx:afterSwap', function(event) {
        var targetId = event.detail.target.id;

        if (targetId === 'screen') {
            currentGuess = '';
            stopTimer();
            if (document.getElementById('game-screen')) {
                updateHeaderColor('game');
                initTimerFromScreen();
            } else if (document.getElementById('start-screen')) {
                updateHeaderColor('start');
            } else if (document.getElementById('leaderboard-screen')) {
                updateHeaderColor('leaderboard');
                initMadlibCycle();
            }
            return;
        }

        if (targetId === 'game-content') {
            currentGuess = '';

            // Flip animation: apply color class at midpoint of each tile's flip
            document.querySelectorAll('.tile-reveal').forEach(function(tile) {
                var colorClass = tile.dataset.color;
                var delayMs = parseInt(tile.style.animationDelay) || 0;
                setTimeout(function() {
                    tile.classList.remove('border-wordle-tile-empty', 'border-wordle-tile-active', 'bg-transparent', 'bg-[rgba(55,71,97,0.3)]');
                    colorClass.split(' ').forEach(function(cls) { tile.classList.add(cls); });
                }, delayMs + TILE_COLOR_OFFSET);
            });

            // Show status + endgame after last tile finishes
            var revealTiles = document.querySelectorAll('.tile-reveal');
            var revealDelay = revealTiles.length > 0
                ? (revealTiles.length - 1) * TILE_FLIP_MS + TILE_FLIP_MS + 200
                : 0;

            setTimeout(function() {
                var statusMsg = document.getElementById('status-message');
                if (statusMsg) statusMsg.classList.remove('hidden');

                var endgame = document.getElementById('endgame-actions');
                if (endgame) {
                    endgame.classList.remove('hidden');
                    stopTimer();
                }

                document.querySelectorAll('.current-tile').forEach(function(tile) {
                    tile.classList.remove('border-wordle-tile-active');
                    tile.classList.add('border-wordle-tile-empty', 'bg-transparent');
                });
            }, revealDelay);

            // Auto-dismiss error overlay after 2 s
            var errorMsg = document.getElementById('error-message');
            if (errorMsg) setTimeout(function() { errorMsg.remove(); }, ERROR_DISMISS_MS);
        }
    });

    document.body.addEventListener('guessError', function(event) {
        var message = event.detail.value;

        var row = document.getElementById('current-row');
        if (row) {
            row.classList.add('shake');
            setTimeout(function() { row.classList.remove('shake'); }, SHAKE_DURATION_MS);
        }

        var existing = document.getElementById('error-toast');
        if (existing) existing.remove();

        var toast = document.createElement('div');
        toast.id = 'error-toast';
        toast.className = 'fixed top-16 left-1/2 -translate-x-1/2 bg-white text-black px-4 py-2 rounded font-bold text-sm z-50';
        toast.textContent = message;
        document.body.appendChild(toast);
        setTimeout(function() { toast.remove(); }, ERROR_DISMISS_MS);
    });
    </script>
</body>
</html>
